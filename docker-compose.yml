services:
  db:
    image: postgres:15-alpine
    container_name: match_mind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-match_mind_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-match_mind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: match_mind_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-match_mind_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_NAME: ${APP_NAME:-match_mind_ai}
      DEBUG: ${DEBUG:-True}
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_info')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
